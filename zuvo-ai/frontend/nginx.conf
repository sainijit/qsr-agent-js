# Browser entry point. Routes API calls to the owning microservice.
# In production Caddy terminates TLS in front of this server (deploy/caddy/Caddyfile).

# Per-client-IP rate limits (429 when exceeded). Caddy replaces any client-supplied X-Forwarded-For,
# so trusting it from private (docker) ranges yields the real client address.
limit_req_zone $binary_remote_addr zone=zuvo_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=zuvo_webhook:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=zuvo_api:10m rate=30r/s;
limit_req_status 429;

# JSON access log. $uri excludes the query string: the SSE stream carries ?access_token=<JWT>, which must never be logged.
# request_id is forwarded upstream as X-Request-ID, so app log lines (request_id field) join to this line.
log_format zuvo_json escape=json '{"timestamp":"$time_iso8601","service":"frontend-nginx","request_id":"$request_id",'
                                 '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
                                 '"bytes":$body_bytes_sent,"request_time":$request_time,'
                                 '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
                                 '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 1m;
    server_tokens off;
    access_log /var/log/nginx/access.log zuvo_json;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Ingress service: Meta webhook + dev simulator
    location /api/v1/whatsapp/ {
        limit_req zone=zuvo_webhook burst=200 nodelay;
        proxy_pass http://gateway:8000;
    }
    location = /api/v1/messages/simulate-inbound {
        proxy_pass http://gateway:8000;
    }

    # Server-sent events: no buffering, long-lived
    location = /api/v1/dashboard/stream {
        proxy_pass http://dashboard-api:8001;
        # a location-level proxy_set_header replaces *all* inherited ones, so repeat them
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Password guessing: 10/min per IP with a small burst
    location = /api/v1/auth/login {
        limit_req zone=zuvo_login burst=5 nodelay;
        proxy_pass http://dashboard-api:8001;
    }

    # Everything else (auth, dashboard, outbound send, health)
    location /api/ {
        limit_req zone=zuvo_api burst=100 nodelay;
        proxy_pass http://dashboard-api:8001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
