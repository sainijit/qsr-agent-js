[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zuvo-common"
version = "0.1.0"
description = "Shared contracts, event bus, tenancy and data-access library for ZuvoCloud services"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.28",
  "asyncpg>=0.29",
  "redis>=5.0",
  "aiokafka>=0.11",
  "pyjwt>=2.8",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["zuvo_common*"]
