# Opt-in: ship container logs to CloudWatch Logs (one log group per service).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f deploy/aws/docker-compose.awslogs.yml up -d
#
# Requires: an EC2 instance role allowing logs:CreateLogGroup/CreateLogStream/PutLogEvents on
# arn:aws:logs:<region>:<account>:log-group:/zuvo/*  and  AWS_REGION in .env.
# Docker >= 20.10 "dual logging" keeps `docker compose logs` working locally.
# `mode: non-blocking` keeps a CloudWatch outage from blocking the app (logs may drop if the buffer fills).
# Cost: CloudWatch ingest is ~$0.50/GB (+ storage); set retention on /zuvo/* (see docs/observability.md).

x-awslogs: &awslogs
  driver: awslogs

services:
  caddy:
    logging:
      <<: *awslogs
      options: !override
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: /zuvo/caddy
        awslogs-create-group: "true"
        mode: non-blocking
        max-buffer-size: 4m
  frontend:
